<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ this.page.meta_title ?: placeholder('pageTitle') }}</title>
        <meta name="description" content="{{ this.page.meta_description }}">
        <meta name="title" content="{{ this.page.meta_title }}">
        <link href="{{ ['assets/scss/app.scss'] |theme }}" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    </head>
    <body class="{{ 'page-'~this.page.id }}">

        {% partial 'site/navbar' %}
        <!-- Header -->
        <header id="layout-header" class="grid-container">
            <div class="text-3xl font-bold">
            </div>
        </header>



        <!-- Content -->
        <section id="layout-content">
            {% page %}
        </section>

        <!-- Footer -->
        <footer id="layout-footer">

        </footer>
        <!-- Compressed JavaScript -->
        {# {% framework extras %} #}
    </body>
</html>
<script src="{{['assets/js/main.js'] |theme }}"></script>
